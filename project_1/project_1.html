<!doctype html>
<html>
  <head>
    <title>File to PDF Converter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
        background: #f4f4f4;
      }

      .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      button {
        padding: 10px 20px;
        margin-top: 15px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      #downloadSection {
        margin-top: 20px;
        display: none;
      }

      a {
        display: inline-block;
        margin-top: 10px;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Upload File Here</h2>

      <input type="file" id="files" multiple accept="image/*" />

      <br />
      <button onclick="convert()">Convert to PDF</button>

      <div id="downloadSection">
        <p>Your file is ready:</p>
        <a id="downloadLink">Download PDF</a>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
      async function convert() {
        const { jsPDF } = window.jspdf;
        const files = document.getElementById("files").files;

        if (!files.length) {
          alert("Please upload at least one file.");
          return;
        }

        const pdf = new jsPDF();

        for (let i = 0; i < files.length; i++) {
          const imgData = await fileToDataURL(files[i]);

          const img = await loadImage(imgData);

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          const imgCanvas = canvas.toDataURL("image/jpeg", 1.0);

          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (img.height * pdfWidth) / img.width;

          if (i !== 0) pdf.addPage();

          pdf.addImage(imgCanvas, "JPEG", 0, 0, pdfWidth, pdfHeight);
        }

        const blob = pdf.output("blob");
        const url = URL.createObjectURL(blob);

        const link = document.getElementById("downloadLink");
        link.href = url;
        link.download = "converted.pdf";

        document.getElementById("downloadSection").style.display = "block";
      }

      function fileToDataURL(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }
    </script>
  </body>
</html>
